<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Anela Acessórios | Ser representante</title>
<!-- Link curto de INDICACAO (pedido da aba Marketing, dono aprovou 22/10): leva pra LP com
     ?origem=indicacao e PRESERVA o resto da query (?i=<rep>, utm). Sem JS, cai no refresh. -->
<meta http-equiv="refresh" content="0;url=/?origem=indicacao">
<script>
try {
  var p = new URLSearchParams(location.search);
  p.set('origem', 'indicacao');
  location.replace('/?' + p.toString() + location.hash);
} catch (e) { location.replace('/?origem=indicacao'); }
</script>
</head><body><a href="/?origem=indicacao">Continuar</a></body></html>
