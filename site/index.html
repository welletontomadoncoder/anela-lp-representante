<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Anela Acessórios | Ser representante</title>
<!-- Link curto do banner "Seja representante" da loja (pedido da aba Marketing, 22/10):
     leva pra LP com ?origem=site e PRESERVA o resto da query. Sem JS, cai no refresh. -->
<meta http-equiv="refresh" content="0;url=/?origem=site">
<script>
try {
  var p = new URLSearchParams(location.search);
  p.set('origem', 'site');
  location.replace('/?' + p.toString() + location.hash);
} catch (e) { location.replace('/?origem=site'); }
</script>
</head><body><a href="/?origem=site">Continuar</a></body></html>
